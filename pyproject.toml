[project]
name = "pptm-kit"
version = "0.1.0"
description = "layout_spec.json 을 python-pptx 네이티브 개체로 렌더하는 편집 가능한 PPT 생성 엔진"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0",
    "pillow>=10.0",
    "typer>=0.12",
    "numpy>=1.26",
    "lxml>=5.0",
    "cairosvg>=2.7",
    "shapely>=2.0",
    "fonttools>=4.50",
]

[project.scripts]
pptm = "pptm.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pptm*"]

[tool.setuptools.package-data]
"pptm.design" = ["themes/*.json", "icons/*.json", "motion_templates/**/*.xml"]
